# Inline conveyor process (ADR-0006). Cycle time = pitch / v + rotation-stage time.
process_id: inline_default
mode: inline
speeds_mps: [0.1, 0.3, 0.6]
pitch_m: 0.3
trigger_sigma_s: 0.005          # trigger jitter -> along-belt misregistration v * sigma
rotation_time_s: {none: 0.0, r90x1: 0.9, r180x1: 1.1, r90x3: 1.7}
rot_reposition_sigma_m: 0.5e-3
rot_yaw_sigma_deg: 1.0
register_icp: true
cycle_time_in_cost: true
