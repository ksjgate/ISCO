[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isco"
version = "0.1.0"
description = "ISCO - Inspection Setup Configuration Optimizer: detector-in-the-loop search of inline 3D inspection cell configurations in an Isaac Sim conveyor digital twin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Team 강화실패 (Korea University capstone 2026-2)" }]
# Versions are intentionally unpinned: the target environment is the existing
# `env_isaaclab` conda env (Isaac Sim 5.1, Python 3.11). Extra packages are installed
# with scripts/install_extra_deps.sh, which applies scripts/constraints-isaacsim.txt.
dependencies = [
  "numpy", "scipy", "trimesh", "open3d", "pymeshlab", "manifold3d",
  "torch", "scikit-learn", "optuna", "pymoo", "pandas", "matplotlib", "seaborn",
  "pydantic>=2", "pyyaml", "typer", "rich", "jinja2", "markdown", "imageio",
]

[project.optional-dependencies]
faiss = ["faiss-cpu"]
dev = ["pytest"]

[project.scripts]
isco = "isco.cli.main:main"

[tool.setuptools.packages.find]
include = ["isco*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
  "isaac: needs Isaac Sim (SimulationApp); run with `pytest -m isaac tests/isaac`",
  "slow: longer-running unit tests",
]
# ROS 2 Humble (sourced in ~/.bashrc on the dev machine) exports a Python-3.10
# PYTHONPATH whose pytest plugins crash on import; disable them explicitly.
addopts = "-ra -p no:launch_testing -p no:launch_testing_ros -p no:launch_ros"
